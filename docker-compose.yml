services:
  db:
    image: pgvector/pgvector:pg16
    container_name: placemate-db
    environment:
      POSTGRES_DB: placemate
      POSTGRES_USER: placemate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-placemate}
    ports:
           - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
